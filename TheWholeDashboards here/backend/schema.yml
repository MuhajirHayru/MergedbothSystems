            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/chat/channels/{channel_pk}/messages/:
    get:
      operationId: v1_chat_channels_messages_list
      description: GET/POST /api/v1/chat/channels/{channelID}/messages/ — message
        history.
      parameters:
      - in: path
        name: channel_pk
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
    post:
      operationId: v1_chat_channels_messages_create
      description: GET/POST /api/v1/chat/channels/{channelID}/messages/ — message
        history.
      parameters:
      - in: path
        name: channel_pk
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]+$
        required: true
