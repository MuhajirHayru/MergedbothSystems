components:
  schemas:
    AccountStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - SUSPENDED
      - DEACTIVATED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
        * `DEACTIVATED` - Deactivated
    AdminAccount:
      type: object
      description: Create/modify Admin sub-role accounts (FR-SA-02).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 8
        phone:
          type: string
          maxLength: 20
        location:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        role_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        is_staff:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - role_display
    Announcement:
      type: object
      description: Body of POST /api/v1/superadmin/announcement/.
      properties:
        message:
          type: string
      required:
      - message
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        actor_role:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        target:
          type: string
          readOnly: true
        detail:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_name
      - created_at
      - detail
      - id
      - target
    BroadcastMessage:
      type: object
      description: Body of POST /api/v1/admin/messages/.
      properties:
        message:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        user_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - message
    CategoryEnum:
      enum:
      - Vegetables
      - Fruits
      - Grains
      - Pulses
      - Spices
      - Root Crops
      - Other
      type: string
      description: |-
        * `Vegetables` - Vegetables
        * `Fruits` - Fruits
        * `Grains` - Grains
        * `Pulses` - Pulses
        * `Spices` - Spices
        * `Root Crops` - Root Crops
        * `Other` - Other
    ChatChannel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/PublicUser'
          readOnly: true
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        related_product:
          type: string
          format: uuid
          nullable: true
        related_product_title:
          type: string
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_message:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - last_message_at
      - participants
      - related_product_title
      - unread_count
    DecisionEnum:
      enum:
      - APPROVE
      - REJECT
      - SUSPEND
      - REACTIVATE
      type: string
      description: |-
        * `APPROVE` - APPROVE
        * `REJECT` - REJECT
        * `SUSPEND` - SUSPEND
        * `REACTIVATE` - REACTIVATE
    DirectoryUser:
      type: object
      description: User Admin / Super Admin view of an account (FR-UA-01, FR-SA-01).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        location:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        role_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AccountStatusEnum'
        status_display:
          type: string
          readOnly: true
        rejection_reason:
          type: string
        privacy_policy_accepted:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - role_display
      - status_display
      - updated_at
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          type: string
          format: uuid
          readOnly: true
        sender:
          type: string
          format: uuid
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        content:
          type: string
        sent_at:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
      required:
      - channel
      - content
      - id
      - is_read
      - sender
      - sender_name
      - sent_at
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        type_display:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - is_read
      - message
      - type
      - type_display
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        wholesaler:
          type: string
          format: uuid
          readOnly: true
        wholesaler_name:
          type: string
          readOnly: true
        farmer:
          type: string
          format: uuid
          readOnly: true
        farmer_name:
          type: string
          readOnly: true
        product:
          type: string
          format: uuid
        product_title:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        allowed_transitions:
          type: array
          items:
            type: string
          readOnly: true
        date:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allowed_transitions
      - created_at
      - date
      - farmer
      - farmer_name
      - id
      - product
      - product_title
      - quantity
      - reference
      - status
      - status_display
      - total
      - total_amount
      - updated_at
      - wholesaler
      - wholesaler_name
    OrderStatusEnum:
      enum:
      - Processing
      - Confirmed
      - Shipped
      - Delivered
      - Cancelled
