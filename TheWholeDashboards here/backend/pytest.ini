[pytest]
DJANGO_SETTINGS_MODULE = greenpath.test_settings
python_files = test_*.py tests.py *_tests.py
testpaths = tests
addopts =
    --strict-markers
    --cov=users
    --cov=products
    --cov=chat
    --cov=payments
    --cov=notifications
    --cov=dashboard
    --cov=greenpath
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
    --ds=greenpath.test_settings
    --timeout=60
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
